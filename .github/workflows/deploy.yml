# Deploys site/ to Vercel on every push.
# Needs ONE repository secret: VERCEL_TOKEN  (Settings → Secrets and variables → Actions → New repository secret)
# Pushes to main (or the default branch) go to production; every other branch gets a preview URL.
name: Deploy to Vercel

on:
  push:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the secret is missing
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rebuilds site/index.html so the PostHog key can live in a repository
      # secret instead of the source. Skip the secret and the site builds
      # exactly as committed, analytics off.
      - name: Build the site
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || vars.POSTHOG_HOST }}
        run: python3 site/build.py

      - name: Link the repo to the Vercel project (creates it on first run)
        run: npx --yes vercel@latest link --yes --project gradient-skin --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          else
            URL=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed → $URL" >> "$GITHUB_STEP_SUMMARY"
